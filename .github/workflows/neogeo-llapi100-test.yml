name: NeoGeo LLAPI and SNAC CPU Turbo test
on:
  push:
    branches: [test-neogeo-llapi-cpu-turbo]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify video, memory and USER I/O
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          iverilog -g2012 -s lspc_guard_tb -o /tmp/lspc rtl/io/neogeo_lspc_guard.v tests/lspc_guard_tb.sv
          vvp /tmp/lspc
          iverilog -g2012 -s sdram_turbo_tb -o /tmp/sdram rtl/mem/sdram_mux.sv tests/sdram_turbo_tb.sv
          vvp /tmp/sdram
          iverilog -g2012 -s db15_test -o /tmp/db15 rtl/io/neogeo_snac_db15.sv tests/db15_test.sv
          vvp /tmp/db15
          iverilog -g2012 -s neogeo_snac_pads_tb -o /tmp/pads rtl/io/neogeo_snac_pads.sv tests/neogeo_snac_pads_tb.sv
          vvp /tmp/pads
          iverilog -g2012 -s user_port_tb -o /tmp/user rtl/io/neogeo_user_port.sv rtl/io/neogeo_snac*.sv tests/user_port_tb.sv
          vvp /tmp/user
      - name: Compile NeoGeo with Quartus 17.0.2
        run: |
          docker run --rm -v "$PWD:/src" -w /src --entrypoint bash raetro/quartus:17.0 -ec '
            quartus_sh --version | tee quartus-version.txt
            grep -F "17.0.2 Build 602" quartus-version.txt
            quartus_sh --flow compile NeoGeo
            test -s output_files/NeoGeo.rbf'
      - name: Check timing margins
        run: |
          awk '
            /^Slack[[:space:]]*:/ {
              if ($3 !~ /^[-+]?[0-9]+([.][0-9]+)?$/) { bad = 1; next }
              count++
              if ($3 + 0 < 0) { print clock, $0; bad = 1 }
            }
            /^Type[[:space:]]*:/ { clock = $0 }
            END { if (bad || !count) exit 1 }
          ' output_files/NeoGeo.sta.summary
      - name: Save RBF and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NeoGeo-LLAPI-1.0.0-SNAC-CPU-Turbo
          path: |
            output_files/*.rbf
            output_files/*.rpt
            output_files/*.summary
            quartus-version.txt
